services:
  backend:
    build:
      context: ./backend
    command: ["uvicorn", "x_digest.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: ./backend/.env
        required: false
    expose:
      - "8000"
    volumes:
      - x_digest_data:/data

volumes:
  x_digest_data:

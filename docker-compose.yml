services:
  frontend:
    image: x-digest-frontend
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

  backend:
    image: x-digest
    build:
      context: ./backend
    command: ["uvicorn", "x_digest.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite+pysqlite:////data/x_digest.db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    expose:
      - "8000"
    volumes:
      - x_digest_data:/data
  scheduler:
    image: x-digest
    build:
      context: ./backend
    command: ["python", "-m", "x_digest.scheduler"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite+pysqlite:////data/x_digest.db
    volumes:
      - x_digest_data:/data

volumes:
  x_digest_data:
